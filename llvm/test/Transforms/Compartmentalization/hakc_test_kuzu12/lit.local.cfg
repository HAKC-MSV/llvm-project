if not "X86" in config.root.targets :
    config.unsupported = True

config.name = "HAKC"

config.base_fname = os.path.basename(os.path.dirname(__file__))

# per test file configurations
# NOTE: if you want to resolve the git path, you need '' around the % value, e.g.,  sed 's,@BUILD_PATH@,'%HAKC_BUILD_PATH',g'
config.substitutions.append(("%HAKC_REPL_PWD",                      "sed 's,@BUILD_PATH@,'%HAKC_BUILD_PATH',g'"))
config.substitutions.append(("%HAKC_REPL_BACKING_TYPE",             "sed 's,@HAKC_BACKING_TYPE@,'%HAKC_BACKING_TYPE',g'"))
config.substitutions.append(("%HAKC_REPL_BACKING_STORE",            "sed 's,@HAKC_BACKING_STORE@,'%HAKC_BACKING_STORE',g'"))
config.substitutions.append(("%HAKC_REPL_DEFAULT_COMPARTMENT",      "sed 's,@HAKC_DEFAULT_COMPARTMENT@,%HAKC_DEFAULT_COMPARTMENT,g'"))
config.substitutions.append(("%HAKC_REPL_DEFAULT_DIVISION",         "sed 's,@HAKC_DEFAULT_DIVISION@,%HAKC_DEFAULT_DIVISION,g'"))
config.substitutions.append(("%HAKC_REPL_SERVER_TIMEOUT",           "sed 's,@SERVER_TIMEOUT@,%HAKC_SERVER_TIMEOUT,g'"))

config.substitutions.append(("%HAKC_YAML_COMP_CONFIG",              "%HAKC_BUILD_PATH/hakc_comp_config.yml"))
config.substitutions.append(("%HAKC_YAML_COMP_DAG_CONFIG",          "%HAKC_BUILD_PATH/hakc_comp_dag_config.yml"))
config.substitutions.append(("%HAKC_YAML_POLICY_CONFIG",            "%HAKC_BUILD_PATH/hakc_policy_config.yml"))
config.substitutions.append(("%HAKC_YAML_BACKING",                  "%HAKC_BUILD_PATH/backing_%BASE_FNAME.yml"))

config.substitutions.append(("%HAKC_BACKING_TYPE",                  "kuzu"))
config.substitutions.append(("%HAKC_BACKING_STORE",                 "%HAKC_BUILD_PATH/hakc-db"))
config.substitutions.append(("%HAKC_DEFAULT_COMPARTMENT",           "0"))
config.substitutions.append(("%HAKC_DEFAULT_DIVISION",              "0"))
config.substitutions.append(("%HAKC_SERVER_TIMEOUT",                "10"))
config.substitutions.append(("%HAKC_CLANG_FLAGS",                   ""))


# note that the __file__ dirname is hakc_test0, as compared to Compartmentalization in the root lit.local.cfg
config.substitutions.append(("%C_SOURCE",                           "%HAKC_TEST_PATH/"  + config.base_fname + "/" + config.base_fname + ".c"))
config.substitutions.append(("%LL_SOURCE",                          "%HAKC_BUILD_PATH/" + config.base_fname + ".orig.ll"))
config.substitutions.append(("%LL_OUT",                             "%HAKC_BUILD_PATH/" + config.base_fname + ".out.ll"))
config.substitutions.append(("%HAKC_TEST_PATH",                     config.test_source_root))
config.substitutions.append(("%HAKC_BUILD_PATH",                    "%HAKC_ROOT/cmake-build-hakc-llvm/llvm-project/llvm/test/Transforms/Compartmentalization/" + config.base_fname))
config.substitutions.append(("%HAKC_ROOT",                          "$(git rev-parse --show-toplevel)"))
config.substitutions.append(("%BASE_FNAME",                         config.base_fname))
