# need subprocess to do path substitutions
import os.path

import hakc_config

# run custom hakc configuration script
if ("HAKC_BACKING_TYPE" in lit_config.params):
    HAKC_BACKING_TYPE = lit_config.params["HAKC_BACKING_TYPE"]
    # need to get the test type at test invocation
    if (HAKC_BACKING_TYPE == "yaml") or (HAKC_BACKING_TYPE == "kuzu"):
        hakc_config.process(__file__, HAKC_BACKING_TYPE)
    else:
        print("HAKC_TEST_TYPE is not yaml, or kuzu!")
        exit(1)
else:
    print("HAKC_TEST_TYPE is required!")
    print("Usage: $HAKC_BUILD_PATH/llvm-project/llvm/bin/llvm-lit --param HAKC_TEST_TYPE=<yaml,kuzu> <hakc_test.c>")
    exit(1)

config.substitutions.append(("%HAKC_CLANG_FLAGS", ""))

# can only get the actual test file name from this file -> substitute backwards into the parent configuration file
# note that the __file__ dirname is hakc_test0, as compared to Compartmentalization in the root lit.local.cfg
config.substitutions.append(("%BASE_FNAME", os.path.basename(os.path.dirname(__file__))))
