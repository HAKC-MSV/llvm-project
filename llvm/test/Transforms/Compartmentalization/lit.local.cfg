if not "X86" in config.root.targets:
    config.unsupported = True

config.name = "HAKC"

config.test_source_root = os.path.dirname(__file__)

# clang -g -S -emit-llvm llvm-project/llvm/test/Transforms/Compartmentalization/hakc/TestCases/Posix/hakc_test0/hakc_test0.c
# python3 python/analysis/hakc-policy-process.py --config HAKC-pass/configs/hakc-policy-config.yaml --log-level DEBUG
# install/bin/opt -passes=hakc --hakc-config=config.yml hakc_test0.ll

# TODO: maybe change optimization levels 
# -save-temps is an option for clang, might be useful for debugging 

# high level commands to be executed in each test file
# replace key words in yaml in with correct names
config.substitutions.append(("%HAKC_PROCESS_YAML_COMP_CONFIG",      "cat %HAKC_YAML_COMP_CONFIG_IN | %HAKC_REPL_PWD | %HAKC_REPL_PASS_MODE > %HAKC_YAML_COMP_CONFIG"))
config.substitutions.append(("%HAKC_PROCESS_YAML_POLICY_CONFIG",    "cat %HAKC_YAML_POLICY_CONFIG_IN | %HAKC_REPL_PWD | %HAKC_REPL_BACKING_TYPE | %HAKC_REPL_BACKING_STORE |  %HAKC_REPL_DEFAULT_COMPARTMENT | %HAKC_REPL_DEFAULT_DIVISION | %HAKC_REPL_SERVER_TIMEOUT > %HAKC_YAML_POLICY_CONFIG"))

# text replacement rules
config.substitutions.append(("%HAKC_REPL_PASS_MODE",                "sed 's,@PASS_MODE@,RunCompartmentalization,g'"))
# config.substitutions.append(("%HAKC_CONFIG_PASS_MODE",            "sed 's,@PASS_MODE@,RunDataAccessGraphAnalysis,g'"))

config.substitutions.append(("%HAKC_PYTHON_VENV",                   "python3 -m venv %HAKC_ROOT/python/venv && source %HAKC_ROOT/python/venv/bin/activate"))
config.substitutions.append(("%HAKC_RUN_PASS",                      "%clang_hakc %HAKC_CLANG_FLAGS -g -mllvm --enable-hakc -mllvm --hakc-config = %HAKC_YAML_COMP_CONFIG -S -emit-llvm -o %HAKC_BUILD_PATH/%t.out.ll %s"))
config.substitutions.append(("%HAKC_START_POLICY_SERVER",           "timeout 15 python3 %HAKC_PYTHON_POLICY_PROCESS --config %HAKC_YAML_POLICY_CONFIG --log-level %LOG_LEVEL & sleep 1"))
config.substitutions.append(("%HAKC_EVALUATE",                      "cat %HAKC_BUILD_PATH/%t.out.ll | FileCheck %HAKC_BUILD_PATH/%s || exit 1"))

# recursive substitutions
# file names 
config.substitutions.append(("%HAKC_YAML_COMP_CONFIG_IN",           "%HAKC_TEST_PATH/configs/hakc_comp_config.yml.in"))
config.substitutions.append(("%HAKC_YAML_POLICY_CONFIG_IN",         "%HAKC_TEST_PATH/configs/hakc_policy_config.yml.in"))
config.substitutions.append(("%HAKC_PYTHON_POLICY_PROCESS",         "%HAKC_ROOT/python/analysis/hakc-policy-process.py"))

config.substitutions.append(("%OPT",                                "%HAKC_ROOT/install/bin/opt"))
config.substitutions.append(("%clang_hakc",                         "%HAKC_ROOT/install/bin/clang"))
config.substitutions.append(("%clangxx_hakc",                       "%HAKC_ROOT/install/bin/clang++"))
config.substitutions.append(("%HAKC_ROOT",                          "$(git rev-parse --show-toplevel)"))
config.substitutions.append(("%HAKC_TEST_PATH",                     config.test_source_root))
config.substitutions.append(("%LOG_LEVEL",                          "DEBUG"))

# Default test suffixes.
# config.suffixes = [".c", ".cpp", ".ll"]
# want to ignore .ll files here, or else when running all tests with llvm-lit * it will pick up the llvm ir files that are not tests 
config.suffixes = [".c", ".cpp"]
