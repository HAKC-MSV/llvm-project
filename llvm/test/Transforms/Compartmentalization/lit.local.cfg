if not "X86" in config.root.targets:
    config.unsupported = True

config.name = "HAKC"

config.test_source_root = os.path.dirname(__file__)

sys.path.append(os.path.dirname(__file__))

config.name = "HAKC"

# high level commands to be executed in each test file
# replace key words in yaml in with correct names

config.substitutions.append(("%HAKC_PYTHON_VENV",                   "python3 -m venv %HAKC_ROOT/python/venv && source %HAKC_ROOT/python/venv/bin/activate"))
config.substitutions.append(("%HAKC_RUN_DAG_PASS",
                             "%clang_hakc %HAKC_CLANG_FLAGS -g -S -emit-llvm -mllvm --enable-hakc -mllvm --hakc-config=%HAKC_YAML_COMP_DAG_CONFIG -o %t.orig.ll %s"))
config.substitutions.append(("%HAKC_RUN_COMP_PASS",
                             "%clang_hakc %HAKC_CLANG_FLAGS -g -S -emit-llvm -mllvm --enable-hakc -mllvm --hakc-config=%HAKC_YAML_COMP_CONFIG -o %t.out.ll %s"))
config.substitutions.append(("%HAKC_RUN_PYTHON_DAG",
                             "python3 %HAKC_PYTHON_DAG_PROCESS --dump-dag %HAKC_YAML_BACKING --create-dag --dag-files-root %HAKC_BUILD_PATH/dag-analysis --db-dir %HAKC_BUILD_PATH/hakc-db --log-level %LOG_LEVEL"))
config.substitutions.append(("%HAKC_START_POLICY_SERVER",
                             "python3 %HAKC_PYTHON_POLICY_PROCESS --config %HAKC_YAML_POLICY_CONFIG --log-level %LOG_LEVEL & sleep 1"))
config.substitutions.append(("%HAKC_EVALUATE", "cat %t.out.ll | FileCheck %s || exit 1"))

config.substitutions.append(("%CLEAN_BUILD", "rm -rf %HAKC_BUILD_PATH && mkdir %HAKC_BUILD_PATH"))

# recursive substitutions
config.substitutions.append(("%HAKC_YAML_COMP_CONFIG", "%HAKC_BUILD_PATH/hakc_comp_config.yml"))
config.substitutions.append(("%HAKC_YAML_COMP_DAG_CONFIG", "%HAKC_BUILD_PATH/hakc_comp_dag_config.yml"))
config.substitutions.append(("%HAKC_YAML_POLICY_CONFIG", "%HAKC_BUILD_PATH/hakc_policy_config.yml"))
config.substitutions.append(("%HAKC_YAML_BACKING", "%HAKC_BUILD_PATH/backing_%BASE_FNAME.yml"))

config.substitutions.append(("%clang_hakc",                         "%HAKC_ROOT/install/bin/clang"))
config.substitutions.append(("%HAKC_BUILD_PATH",
                             "%HAKC_ROOT/cmake-build-hakc-llvm/llvm-project/llvm/test/Transforms/Compartmentalization/%BASE_FNAME"))
config.substitutions.append(("%HAKC_ROOT", "$(git rev-parse --show-toplevel)"))
config.substitutions.append(("%LOG_LEVEL",                          "ERROR"))

config.suffixes = [".c", ".cpp"]
