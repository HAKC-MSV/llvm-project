if not "X86" in config.root.targets:
    config.unsupported = True

config.name = "HAKC"

config.test_source_root = os.path.dirname(__file__)


# high level commands to be executed in each test file
# replace key words in yaml in with correct names
config.substitutions.append(("%HAKC_PROCESS_YAML_COMP_DAG_CONFIG",  "cat %HAKC_YAML_COMP_CONFIG_IN | %HAKC_REPL_PWD | %HAKC_REPL_PASS_MODE_DAG  > %HAKC_YAML_COMP_DAG_CONFIG"))
config.substitutions.append(("%HAKC_PROCESS_YAML_COMP_CONFIG",      "cat %HAKC_YAML_COMP_CONFIG_IN | %HAKC_REPL_PWD | %HAKC_REPL_PASS_MODE_COMP > %HAKC_YAML_COMP_CONFIG"))
config.substitutions.append(("%HAKC_PROCESS_YAML_POLICY_CONFIG",    "cat %HAKC_YAML_POLICY_CONFIG_IN | %HAKC_REPL_PWD | %HAKC_REPL_BACKING_TYPE | %HAKC_REPL_BACKING_STORE |  %HAKC_REPL_DEFAULT_COMPARTMENT | %HAKC_REPL_DEFAULT_DIVISION | %HAKC_REPL_SERVER_TIMEOUT > %HAKC_YAML_POLICY_CONFIG"))

# text replacement rules
config.substitutions.append(("%HAKC_REPL_PASS_MODE_COMP",           "sed 's,@PASS_MODE@,RunCompartmentalization,g'"))
config.substitutions.append(("%HAKC_REPL_PASS_MODE_DAG",            "sed 's,@PASS_MODE@,RunDataAccessGraphAnalysis,g'"))

config.substitutions.append(("%HAKC_PYTHON_VENV",                   "python3 -m venv %HAKC_ROOT/python/venv && source %HAKC_ROOT/python/venv/bin/activate"))
config.substitutions.append(("%HAKC_EMIT_LLVM",                     "%clang_hakc %HAKC_CLANG_FLAGS -g -S -emit-llvm -o %LL_SOURCE -c %C_SOURCE"))
config.substitutions.append(("%HAKC_RUN_DAG_PASS",                  "%clang_hakc %HAKC_CLANG_FLAGS -g -S -emit-llvm -mllvm --enable-hakc -mllvm --hakc-config=%HAKC_YAML_COMP_DAG_CONFIG -o %LL_SOURCE %C_SOURCE"))
config.substitutions.append(("%HAKC_RUN_COMP_PASS",                 "%clang_hakc %HAKC_CLANG_FLAGS -g -S -emit-llvm -mllvm --enable-hakc -mllvm --hakc-config=%HAKC_YAML_COMP_CONFIG -o %LL_SOURCE %C_SOURCE"))
config.substitutions.append(("%HAKC_RUN_PYTHON_DAG",                "python3 %HAKC_PYTHON_DAG_PROCESS --dump-dag %HAKC_YAML_BACKING --create-dag --dag-files-root %HAKC_BUILD_PATH/dag_analysis/_HAKC_SOURCE_PATH_ --db-dir %HAKC_BUILD_PATH/hakc-db --log-level %LOG_LEVEL"))
config.substitutions.append(("%HAKC_START_POLICY_SERVER",           "python3 %HAKC_PYTHON_POLICY_PROCESS --config %HAKC_YAML_POLICY_CONFIG --log-level %LOG_LEVEL & sleep 1"))
config.substitutions.append(("%HAKC_EVALUATE",                      "cat %LL_OUT | FileCheck %C_SOURCE || exit 1"))

# recursive substitutions
# file names 
config.substitutions.append(("%HAKC_YAML_COMP_CONFIG_IN",           "%HAKC_TEST_PATH/configs/hakc_comp_config.yml.in"))
config.substitutions.append(("%HAKC_YAML_POLICY_CONFIG_IN",         "%HAKC_TEST_PATH/configs/hakc_policy_config.yml.in"))
config.substitutions.append(("%HAKC_PYTHON_POLICY_PROCESS",         "%HAKC_ROOT/python/analysis/hakc-policy-process.py"))
config.substitutions.append(("%HAKC_PYTHON_DAG_PROCESS",            "%HAKC_ROOT/python/analysis/hakc-dag.py"))

config.substitutions.append(("%clang_hakc",                         "%HAKC_ROOT/install/bin/clang"))
#config.substitutions.append(("%HAKC_ROOT",                          "$(git rev-parse --show-toplevel)"))
config.substitutions.append(("%LOG_LEVEL",                          "DEBUG"))

# Default test suffixes.
# config.suffixes = [".c", ".cpp", ".ll"]
# want to ignore .ll files here, or else when running all tests with llvm-lit * it will pick up the llvm ir files that are not tests 
config.suffixes = [".c", ".cpp"]
